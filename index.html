<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>John · Portfolio</title>
  <meta name="description" content="John's portfolio: five things built this quarter.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The text in this file is only a starting point; main.js fills
       everything in from content.js when the page loads. -->
  <div class="page">
    <header class="top">
      <div class="hero">
        <h1><span class="greeting" id="greeting">Hey, I'm</span> <span id="name">John.</span></h1>
        <p id="about"></p>
      </div>
      <nav class="lang-switch" id="lang-switch" aria-label="Language"></nav>
    </header>

    <main class="artifacts">
      <h2 id="artifacts-heading">What I'm building this quarter</h2>
      <div class="cards" id="cards"></div>
      <noscript><p>This page needs JavaScript turned on to show the project cards.</p></noscript>
    </main>

    <footer class="foot">
      <p id="footer-text"></p>
    </footer>
  </div>

  <!-- Load order matters: content first, then the code that uses it. -->
  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
