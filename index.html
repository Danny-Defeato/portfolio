<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>John · Portfolio</title>
  <meta name="description" content="John's portfolio: five things built this quarter.">

  <!-- Favicon: the little icon in the browser tab. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#10141f">

  <!-- Social preview: what shows up when someone shares your link.
       IMPORTANT: chat apps need the FULL address of the image. After you
       deploy, replace YOUR-USERNAME below with your GitHub username
       (and "portfolio" with your repo name, if you named it differently). -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="John Nguyen · Portfolio">
  <meta property="og:description" content="Senior CS student and future game developer. Five things I'm building this quarter.">
  <meta property="og:image" content="https://Danny-Defeato.github.io/portfolio/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="styles.css">

  <script>
    // Pick light or dark mode before the page draws, so it never flashes
    // the wrong colors. Uses the visitor's saved choice, or else their
    // device setting.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("portfolio-theme"); } catch (e) {}
      if (theme !== "dark" && theme !== "light") {
        var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        theme = prefersLight ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <!-- The text in this file is only a starting point; main.js fills
       everything in from content.js when the page loads. -->

  <nav class="topbar" aria-label="Main">
    <div class="topbar-inner">
      <a class="brand" href="#top"><img src="favicon.svg" alt="" width="26" height="26"><span id="brand">John</span></a>
      <div class="nav-links">
        <a href="#about" id="nav-about">About</a>
        <a href="#artifacts" id="nav-artifacts">Artifacts</a>
        <a href="#contact" id="nav-contact">Contact</a>
      </div>
      <div class="nav-tools">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Dark mode" title="Dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <div class="page" id="top">
    <header class="banner">
      <div class="banner-art" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="eyebrow" id="eyebrow">Portfolio</p>
      <h1 id="name">John</h1>
      <p class="role" id="role"></p>
      <div class="banner-row">
        <a class="play" href="#artifacts" id="continue">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
          <span id="continue-text">Continue</span>
        </a>
        <div class="xp">
          <p class="xp-now" id="now" hidden><span id="now-label">Now</span>: <span id="now-text"></span></p>
          <div class="xp-bar" id="xp-bar" role="progressbar" aria-valuemin="0"><i id="xp-fill"></i></div>
          <p class="xp-count" id="xp-count"></p>
        </div>
      </div>
    </header>

    <main>
      <section class="section" id="about" aria-labelledby="about-heading">
        <h2 id="about-heading">About me</h2>
        <div class="about-body panel">
          <p id="about-text"></p>
          <div class="skills">
            <h3 id="skills-heading">What I work with</h3>
            <ul class="chips" id="skills"></ul>
          </div>
        </div>
      </section>

      <section class="section" id="artifacts" aria-labelledby="artifacts-heading">
        <h2 id="artifacts-heading">My library</h2>
        <div id="featured"></div>
        <div class="cards" id="cards"></div>
        <noscript><p>This page needs JavaScript turned on to show the project cards.</p></noscript>
      </section>

      <section class="section" id="contact" aria-labelledby="contact-heading">
        <h2 id="contact-heading">Contact</h2>
        <div class="contact-panel panel">
          <div class="contact-intro">
            <h3 id="contact-title">Let's connect</h3>
            <p id="contact-message"></p>
          </div>
          <ul class="contact-list" id="contact-list"></ul>
        </div>
      </section>
    </main>

    <footer class="foot">
      <div class="foot-row">
        <p id="footer-text"></p>
        <a href="#top" id="back-to-top">Back to top</a>
      </div>
    </footer>
  </div>

  <!-- Card details pop-up. main.js fills it in when a card is clicked. -->
  <dialog class="detail" id="detail" aria-labelledby="detail-title">
    <div class="detail-art" id="detail-art"></div>
    <div class="detail-body">
      <p class="tag" id="detail-tag"></p>
      <h2 id="detail-title"></h2>
      <div class="detail-text" id="detail-text"></div>
      <div class="detail-images" id="detail-images"></div>
      <div class="detail-actions">
        <a class="play" id="detail-link" target="_blank" rel="noopener"></a>
        <button class="ghost" type="button" id="detail-close">Close</button>
      </div>
    </div>
  </dialog>

  <!-- Achievement pop-up. -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="medal" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5-4.9-4.5 6.6-.8z" fill="currentColor"/></svg>
    </span>
    <span class="toast-text">
      <small id="toast-label">Achievement unlocked</small>
      <b id="toast-title"></b>
    </span>
    <span class="toast-xp" id="toast-xp">+100 XP</span>
  </div>

  <!-- Load order matters: content first, then the code that uses it. -->
  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
